# Local development only — never use these values in any shared environment.
spring:
  datasource:
    password: shopivo_app_dev
  flyway:
    password: shopivo_owner_dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

shopivo:
  security:
    cookie-secure: false
    # Convenience for local work only; production default is true.
    require-platform-staff-mfa: false
    encryption:
      # 32 zero-bytes key, base64 — DEV ONLY
      keys: "1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  public-api-url: http://localhost:8080
  # Storefront dev server (npm run start:storefront) serves every store on <slug>.shopivo.localhost:4000.
  storefront-url-template: "http://{host}:4000"
  shipping:
    # Simulated carrier for local development and tests only (refused in production profiles).
    fake-carrier:
      enabled: true
  payments:
    # Simulated operator: payment page auto-confirms and posts a signed notification back (local only).
    fake-gateway:
      enabled: true
      auto-confirm: true
  bootstrap:
    admin-email: admin@shopivo.local
    admin-password: "Platforma!Lokalna-2026"

logging:
  level:
    pl.shopivo: DEBUG
