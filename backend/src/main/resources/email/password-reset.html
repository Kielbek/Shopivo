<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{_layout :: layout(~{::title}, ~{::section})}" lang="pl">
<head><title>Ustaw nowe hasło w Shopivo</title></head>
<body>
<section>
  <h1 style="font-size:20px;margin:0 0 12px;">Cześć <span th:text="${firstName}">Jan</span>,</h1>
  <p>otrzymaliśmy prośbę o zmianę hasła do Twojego konta.</p>
  <p style="margin:24px 0;"><a th:href="${link}" style="display:inline-block;background:#18181b;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:600;">Ustaw nowe hasło</a></p>
  <p style="color:#52525b;font-size:13px;">Link jest ważny przez 1 godzinę i można go użyć tylko raz. Jeśli to nie Ty prosiłeś o zmianę, zignoruj tę wiadomość — hasło pozostanie bez zmian.</p>
</section>
</body>
</html>
