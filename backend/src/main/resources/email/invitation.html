<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{_layout :: layout(~{::title}, ~{::section})}" lang="pl">
<head><title>Zaproszenie do zespołu sklepu</title></head>
<body>
<section>
  <h1 style="font-size:20px;margin:0 0 12px;">Zaproszenie do sklepu <span th:text="${storeName}">Sklep</span></h1>
  <p><span th:text="${inviterName}">Anna Kowalska</span> zaprasza Cię do współpracy w sklepie <strong th:text="${storeName}">Sklep</strong> z rolą <strong th:text="${roleLabel}">Menedżer</strong>.</p>
  <p style="margin:24px 0;"><a th:href="${link}" style="display:inline-block;background:#18181b;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:600;">Przyjmij zaproszenie</a></p>
  <p style="color:#52525b;font-size:13px;">Zaproszenie jest ważne przez 7 dni. Jeśli nie masz jeszcze konta w Shopivo, utworzysz je po kliknięciu w link.</p>
</section>
</body>
</html>
