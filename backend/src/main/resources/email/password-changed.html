<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{_layout :: layout(~{::title}, ~{::section})}" lang="pl">
<head><title>Hasło do konta Shopivo zostało zmienione</title></head>
<body>
<section>
  <h1 style="font-size:20px;margin:0 0 12px;">Cześć <span th:text="${firstName}">Jan</span>,</h1>
  <p>hasło do Twojego konta zostało właśnie zmienione, a pozostałe sesje zostały wylogowane.</p>
  <p style="color:#52525b;font-size:13px;">Jeśli to nie Ty, natychmiast <a th:href="${appUrl + '/przypomnij-haslo'}">zresetuj hasło</a> i skontaktuj się z pomocą techniczną.</p>
</section>
</body>
</html>
