shopivo:
  platform-domain: shopivo.test
  app-url: https://app.shopivo.test
  admin-url: https://admin.shopivo.test
  mail:
    from: "Shopivo <no-reply@shopivo.test>"
  security:
    cookie-secure: true
    # Enforcement itself is covered by PlatformStaffMfaIT.
    require-platform-staff-mfa: false
    encryption:
      keys: "1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      active-key: 1
  public-api-url: https://api.shopivo.test
  storage:
    type: local
    local-dir: ${java.io.tmpdir}/shopivo-test-media
  payments:
    fake-gateway:
      enabled: true
      auto-confirm: false
  billing:
    # Jobs are driven explicitly by the tests.
    job-interval: PT24H
    usage-flush-interval: PT24H
    fair-use-cron: "-"
  bootstrap:
    admin-email: admin@shopivo.test
    admin-password: "Platforma!Testowa-2026"

management:
  server:
    port: 0
logging:
  level:
    pl.shopivo: INFO
