<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Shopivo — panel sklepu</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#18181b">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0F1210">
</head>
<body>
  <sv-root>
    <!-- Shown until Angular starts (replaced on bootstrap): a neutral skeleton, no spinner. -->
    <style>
      .boot{min-height:100vh;display:flex;background:#F2F3F0;font-family:system-ui,sans-serif}
      .boot-side{width:252px;background:#0F1210;padding:20px;display:none}
      .boot-side b{background:rgba(255,255,255,.08);animation:none}
      .boot-main{flex:1;padding:24px 32px}
      .boot b{display:block;border-radius:10px;margin-bottom:14px;background:linear-gradient(90deg,#E6E8E3 0%,#E6E8E3 35%,#F5F6F3 50%,#E6E8E3 65%,#E6E8E3 100%);background-size:300% 100%;animation:boot 1.5s ease-in-out infinite}
      @keyframes boot{from{background-position:100% 0}to{background-position:-100% 0}}
      @media (min-width:1024px){.boot-side{display:block}}
      @media (prefers-reduced-motion:reduce){.boot b{animation:none}}
    </style>
    <div class="boot" role="status" aria-busy="true" aria-label="Wczytywanie panelu">
      <div class="boot-side"><b style="height:32px;width:60%"></b><b style="height:30px;margin-top:28px"></b><b style="height:30px;width:85%"></b><b style="height:30px;width:75%"></b><b style="height:30px;width:80%"></b><b style="height:30px;width:70%"></b></div>
      <div class="boot-main"><b style="height:36px;width:280px"></b><b style="height:28px;width:220px;margin-top:32px"></b><b style="height:110px;margin-top:20px"></b><b style="height:260px"></b></div>
    </div>
  </sv-root>
</body>
</html>
